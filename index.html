<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandy & Hailey 數位收租小卡</title>
    <style>
        /* --- 全新色系設定 --- */
        :root {
            --alice-blue: #edf2fbff;
            --lavender: #e2eafcff;
            --lavender-2: #d7e3fcff;
            --periwinkle: #ccdbfdff;
            --periwinkle-2: #c1d3feff;
            --periwinkle-3: #b6ccfeff;
            --baby-blue-ice: #abc4ffff;
            --text-main: #3a4b73;
            --text-light: #6b7c9f;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, var(--alice-blue) 0%, var(--lavender-2) 50%, var(--periwinkle-2) 100%);
            background-attachment: fixed;
            margin: 0; padding: 0; color: var(--text-main);
            word-break: keep-all; overflow-x: hidden;
        }

        /* 登入畫面 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(237, 242, 251, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-title { font-size: 1.8rem; margin-bottom: 40px; font-weight: bold; color: var(--text-main); }
        .login-btn {
            width: 80%; max-width: 300px; padding: 20px; margin: 12px;
            border: none; border-radius: 15px; font-size: 1.3rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 8px 20px rgba(171, 196, 255, 0.4);
            background: white; color: var(--text-main); transition: transform 0.2s;
        }
        .login-btn:active { transform: scale(0.95); }

        /* 主容器與頭部 */
        .container { display: none; max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 140px; }
        header {
            background-color: rgba(255, 255, 255, 0.85); padding: 20px;
            text-align: center; font-size: 1.4rem; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 100;
        }
        .user-tag { background: var(--baby-blue-ice); color: white; font-size: 0.9rem; padding: 4px 12px; border-radius: 20px; margin-left: 10px; vertical-align: middle; }

        /* 分頁按鈕 */
        .tabs { display: flex; overflow-x: auto; background: rgba(255, 255, 255, 0.6); padding: 10px; border-bottom: 2px solid var(--lavender); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 0 0 auto; padding: 12px 15px; border: none; background: none; font-size: 1.05rem; color: var(--text-light); cursor: pointer; }
        .tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--baby-blue-ice); }

        /* 內容區塊與卡片 */
        .content { padding: 20px; }
        .card {
            background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(171, 196, 255, 0.2); display: flex; align-items: center; justify-content: space-between;
        }
        .item-info { flex-grow: 1; cursor: pointer; }
        .item-date { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .item-price { font-size: 1rem; color: var(--baby-blue-ice); font-weight: bold; }
        
        .checkbox { width: 34px; height: 34px; border: 3px solid var(--periwinkle-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: white; transition: 0.2s; }
        .checkbox.checked { background-color: var(--baby-blue-ice); border-color: var(--baby-blue-ice); }
        .checkbox.checked::after { content: '✔'; color: white; font-size: 1.2rem; font-weight: bold; }

        /* 浮動總金額 Bar */
        .total-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; background: var(--text-main); color: white;
            padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex; justify-content: space-between; align-items: center; z-index: 150;
            cursor: pointer;
        }
        .total-bar .amount { font-size: 1.5rem; font-weight: bold; color: var(--baby-blue-ice); }
        .total-bar .hint { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

        /* 新增項目按鈕 */
        .add-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.5); border: 2px dashed var(--periwinkle-3); border-radius: 15px; color: var(--text-main); font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; display: none; }

        /* 彈出視窗 (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: var(--text-light); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-main); }
        .input-group input { width: 100%; padding: 12px; border: 2px solid var(--lavender); border-radius: 10px; box-sizing: border-box; font-size: 1.1rem; }
        .save-btn { width: 100%; padding: 15px; background: var(--baby-blue-ice); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* 多張照片預覽網格 */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .photo-box { width: 100%; aspect-ratio: 1; background: var(--alice-blue); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--periwinkle-3); cursor: pointer; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-add-icon { font-size: 2rem; color: var(--periwinkle-2); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-title">請選擇登入身份</div>
        <button class="login-btn" onclick="login('S')">Sandy</button>
        <button class="login-btn" onclick="login('H')">Hailey</button>
    </div>

    <div class="container" id="main-container">
        <header>數位收租與水電明細 <span id="current-user-tag" class="user-tag"></span></header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rent')">每週房租</button>
            <button class="tab-btn" onclick="switchTab('water')">水費</button>
            <button class="tab-btn" onclick="switchTab('energy')">電費煤氣</button>
            <button class="tab-btn" onclick="switchTab('net')">網路</button>
            <button class="tab-btn" onclick="switchTab('others')">其他</button>
        </div>

        <div class="content">
            <button id="add-item-btn" class="add-btn" onclick="openAddModal()">＋ 新增項目</button>
            <div id="tab-content"></div>
        </div>
    </div>

    <div class="total-bar" onclick="triggerBatchUpload()">
        <div>
            <div>目前已勾選總計</div>
            <div class="hint">點擊此處，為所有打勾項目批次上傳照片</div>
        </div>
        <div class="amount" id="total-amount">0 AUD</div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-modal')">&times;</span>
            <h3 style="margin-top:0;">新增紀錄</h3>
            <div class="input-group">
                <label>日期</label>
                <input type="date" id="new-date">
            </div>
            <div class="input-group">
                <label>總金額 (AUD)</label>
                <input type="number" id="new-amount" placeholder="輸入完整金額">
            </div>
            <button class="save-btn" onclick="saveNewItem()">確認儲存</button>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('detail-modal')">&times;</span>
            <h3 id="modal-date" style="margin-top:0; font-size: 1.3rem;">日期</h3>
            <p id="modal-price" style="color: var(--baby-blue-ice); font-weight: bold; font-size: 1.1rem;">金額</p>
            
            <div class="photo-grid" id="photo-grid">
                </div>
            
            <input type="file" id="single-photo-input" accept="image/*" style="display: none;" onchange="handleSinglePhotoUpload(this)">
            <input type="file" id="batch-photo-input" accept="image/*" style="display: none;" onchange="handleBatchPhotoUpload(this)">
        </div>
    </div>

    <script>
        let currentUser = '';
        let currentTab = 'rent';
        let currentItemKey = '';

        // 資料庫初始化 V3
        let appData = JSON.parse(localStorage.getItem('rentDataV3')) || {
            checks_S: {}, checks_H: {}, photos: {}, 
            water: [], energy: [], others: [] // [{id, date, amount}]
        };

        function login(user) {
            currentUser = user;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            document.getElementById('current-user-tag').innerText = user === 'S' ? 'Sandy' : 'Hailey';
            renderTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTab();
        }

        function renderTab() {
            const container = document.getElementById('tab-content');
            const addBtn = document.getElementById('add-item-btn');
            container.innerHTML = '';
            
            // 判斷是否顯示新增按鈕
            if (['water', 'energy'].includes(currentTab) && currentUser === 'S') {
                addBtn.style.display = 'block';
            } else if (currentTab === 'others') {
                addBtn.style.display = 'block';
            } else {
                addBtn.style.display = 'none';
            }

            // 渲染列表
            if (currentTab === 'rent') {
                const rentAmount = currentUser === 'S' ? 500 : 400;
                generateDates('2026-05-17', 7, 52).forEach(date => {
                    container.appendChild(createCard(`rent_${date}`, date, rentAmount));
                });
            } else if (currentTab === 'net') {
                generateMonths('2026-05-15', 12).forEach(date => {
                    container.appendChild(createCard(`net_${date}`, date, 36));
                });
            } else if (['water', 'energy', 'others'].includes(currentTab)) {
                // 排序日期 (新到舊)
                let items = appData[currentTab].sort((a,b) => new Date(b.date) - new Date(a.date));
                items.forEach(item => {
                    let displayAmount = item.amount;
                    // 水電若為 Hailey 登入，或 Sandy 查看卡片，顯示邏輯如下：
                    // Prompt要求：Sandy輸入全額，卡片顯示全額但加總算一半；Hailey水電顯示一半，加總算全額(一半的全額)
                    if (['water', 'energy'].includes(currentTab)) {
                        if (currentUser === 'H') displayAmount = item.amount / 2;
                    }
                    container.appendChild(createCard(`${currentTab}_${item.id}`, item.date, displayAmount, item.amount));
                });
            }
            updateTotal();
        }

        function createCard(key, date, displayPrice, originalPrice = displayPrice) {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            const isChecked = checks[key] ? 'checked' : '';
            
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="item-info" onclick="openDetailModal('${key}', '${date}', '${displayPrice}')">
                    <div class="item-date">${date}</div>
                    <div class="item-price">${displayPrice} AUD</div>
                </div>
                <div class="checkbox ${isChecked}" onclick="toggleCheck('${key}')"></div>
            `;
            return div;
        }

        // --- 核心邏輯 ---
        function toggleCheck(key) {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            checks[key] = !checks[key];
            saveData();
            renderTab();
        }

        function updateTotal() {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            let total = 0;

            for (let key in checks) {
                if (checks[key]) {
                    const [type, id] = key.split('_');
                    if (type === 'rent') total += (currentUser === 'S' ? 500 : 400);
                    if (type === 'net') total += 36;
                    if (type === 'water' || type === 'energy') {
                        const item = appData[type].find(i => i.id == id);
                        if (item) total += (item.amount / 2); // 兩人都只加總一半
                    }
                    if (type === 'others') {
                        const item = appData.others.find(i => i.id == id);
                        if (item) total += parseFloat(item.amount);
                    }
                }
            }
            document.getElementById('total-amount').innerText = total + ' AUD';
        }

        // --- 動態新增項目 ---
        function openAddModal() {
            document.getElementById('new-date').value = '';
            document.getElementById('new-amount').value = '';
            document.getElementById('add-modal').style.display = 'flex';
        }

        function saveNewItem() {
            const date = document.getElementById('new-date').value;
            const amount = document.getElementById('new-amount').value;
            if(!date || !amount) return alert('請填寫完整資訊');
            
            appData[currentTab].push({
                id: Date.now(),
                date: date,
                amount: amount
            });
            saveData();
            closeModal('add-modal');
            renderTab();
        }

        // --- 相片處理 ---
        function openDetailModal(key, date, price) {
            currentItemKey = key;
            document.getElementById('modal-date').innerText = date;
            document.getElementById('modal-price').innerText = price + " AUD";
            
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            let photos = appData.photos[key] || [];
            
            // 渲染現有照片
            photos.forEach(base64 => {
                const box = document.createElement('div');
                box.className = 'photo-box';
                box.innerHTML = `<img src="${base64}">`;
                grid.appendChild(box);
            });

            // 渲染新增按鈕 (最多4張)
            if (photos.length < 4) {
                const addBox = document.createElement('div');
                addBox.className = 'photo-box';
                addBox.innerHTML = `<div class="photo-add-icon">＋</div>`;
                addBox.onclick = () => document.getElementById('single-photo-input').click();
                grid.appendChild(addBox);
            }

            document.getElementById('detail-modal').style.display = 'flex';
        }

        // 單張上傳 (使用圖片壓縮避免容量爆掉)
        function handleSinglePhotoUpload(input) {
            if (input.files && input.files[0]) {
                compressImage(input.files[0], (base64) => {
                    if(!appData.photos[currentItemKey]) appData.photos[currentItemKey] = [];
                    appData.photos[currentItemKey].push(base64);
                    saveData();
                    openDetailModal(currentItemKey, document.getElementById('modal-date').innerText, document.getElementById('modal-price').innerText.replace(' AUD',''));
                });
            }
            input.value = ''; // 重置 input
        }

        // 批次上傳 (總金額列點擊)
        function triggerBatchUpload() {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            const hasChecked = Object.values(checks).some(v => v === true);
            if(!hasChecked) return alert('請先勾選要上傳繳費證明的項目！');
            document.getElementById('batch-photo-input').click();
        }

        function handleBatchPhotoUpload(input) {
            if (input.files && input.files[0]) {
                const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
                compressImage(input.files[0], (base64) => {
                    for (let key in checks) {
                        if (checks[key]) {
                            if(!appData.photos[key]) appData.photos[key] = [];
                            // 如果沒滿4張才塞進去
                            if(appData.photos[key].length < 4) {
                                appData.photos[key].push(base64);
                            }
                        }
                    }
                    saveData();
                    alert('已成功批次為所有打勾項目加入收據照片！');
                });
            }
            input.value = '';
        }

        // 圖片壓縮引擎
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // 限制解析度
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); // 壓縮比60%
                }
            }
        }

        // --- 輔助工具 ---
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function saveData() { localStorage.setItem('rentDataV3', JSON.stringify(appData)); }

        function generateDates(startStr, gapDays, count) {
            let dates = [];
            let [y, m, d] = startStr.split('-');
            let curr = new Date(y, m - 1, d); 
            for (let i = 0; i < count; i++) {
                dates.push(`${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`);
                curr.setDate(curr.getDate() + gapDays);
            }
            return dates;
        }

        function generateMonths(startStr, count) {
            let dates = [];
            let [y, m, d] = startStr.split('-');
            let curr = new Date(y, m - 1, d); 
            for (let i = 0; i < count; i++) {
                dates.push(`${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`);
                curr.setMonth(curr.getMonth() + 1);
            }
            return dates;
        }
    </script>
</body>
</html>
