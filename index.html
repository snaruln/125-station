<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandy & Hailey 數位收租小卡</title>
    <style>
        /* --- 全新色系設定 --- */
        :root {
            --alice-blue: #edf2fbff; --lavender: #e2eafcff; --lavender-2: #d7e3fcff;
            --periwinkle: #ccdbfdff; --periwinkle-2: #c1d3feff; --periwinkle-3: #b6ccfeff;
            --baby-blue-ice: #abc4ffff; --text-main: #3a4b73; --text-light: #6b7c9f;
            --success: #81c784; --danger: #e57373; --warning: #ffb74d;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, var(--alice-blue) 0%, var(--lavender-2) 50%, var(--periwinkle-2) 100%);
            background-attachment: fixed; margin: 0; padding: 0; color: var(--text-main);
            word-break: keep-all; overflow-x: hidden;
        }

        /* 登入畫面 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(237, 242, 251, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-title { font-size: 1.8rem; margin-bottom: 40px; font-weight: bold; color: var(--text-main); }
        .login-btn {
            width: 80%; max-width: 300px; padding: 20px; margin: 12px;
            border: none; border-radius: 15px; font-size: 1.3rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 8px 20px rgba(171, 196, 255, 0.4);
            background: white; color: var(--text-main); transition: transform 0.2s;
        }
        .login-btn:active { transform: scale(0.95); }

        /* 主容器與頭部 */
        .container { display: none; max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 160px; }
        header {
            background-color: rgba(255, 255, 255, 0.85); padding: 20px 15px;
            text-align: center; font-size: 1.3rem; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-title-area { display: flex; align-items: center; }
        .user-tag { background: var(--baby-blue-ice); color: white; font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
        
        .logout-btn {
            background: transparent; border: 1.5px solid var(--periwinkle-3);
            color: var(--text-light); padding: 5px 12px; border-radius: 12px;
            font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        /* 分頁按鈕 */
        .tabs { display: flex; overflow-x: auto; background: rgba(255, 255, 255, 0.6); padding: 10px; border-bottom: 2px solid var(--lavender); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 0 0 auto; padding: 12px 15px; border: none; background: none; font-size: 1.05rem; color: var(--text-light); cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--baby-blue-ice); }

        /* 內容區塊與卡片 */
        .content { padding: 20px; }
        .card {
            background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(171, 196, 255, 0.2); display: flex; align-items: center; justify-content: flex-start;
        }
        
        /* 勾選方格 */
        .checkbox-container { width: 40px; flex-shrink: 0; display: flex; justify-content: center; margin-right: 15px; }
        .checkbox { 
            width: 32px; height: 32px; border: 3px solid var(--periwinkle-2); border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; background: white; transition: 0.2s;
        }
        .checkbox.checked { background-color: var(--baby-blue-ice); border-color: var(--baby-blue-ice); }
        .checkbox.checked::after { content: '✔'; color: white; font-size: 1.2rem; font-weight: bold; }
        .paid-badge { font-size: 0.8rem; background: #e0e0e0; color: #757575; padding: 5px 8px; border-radius: 8px; font-weight: bold; text-align: center; }

        .item-info { flex-grow: 1; cursor: pointer; transition: 0.3s; width: calc(100% - 55px); }
        .item-date { font-size: 1.1rem; font-weight: bold; margin-bottom: 2px; line-height: 1.3; }
        .item-subtitle { font-size: 0.95rem; color: var(--text-light); margin-bottom: 5px; font-weight: bold; }
        .item-price { font-size: 1rem; color: var(--baby-blue-ice); font-weight: bold; }
        .crossed-out .item-date, .crossed-out .item-subtitle, .crossed-out .item-price { text-decoration: line-through; color: #b0bec5; }

        /* 浮動總金額 Bar */
        .total-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; background: var(--text-main); color: white;
            padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; justify-content: space-between; align-items: center; z-index: 150; transition: 0.3s;
        }
        .total-bar.disabled { background: var(--text-light); opacity: 0.6; cursor: not-allowed; }
        .total-bar.active { cursor: pointer; background: var(--baby-blue-ice); }
        .total-bar .amount { font-size: 1.6rem; font-weight: bold; }
        .total-bar .hint { font-size: 0.9rem; opacity: 0.9; margin-top: 4px; }

        /* 操作按鈕群 */
        .add-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.5); border: 2px dashed var(--periwinkle-3); border-radius: 15px; color: var(--text-main); font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; display: none; }
        .export-btn { display: block; width: 100%; text-align: center; color: var(--warning); font-size: 0.95rem; margin-top: 40px; padding: 15px; background: rgba(255, 183, 77, 0.1); border: 1px solid var(--warning); border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .export-btn:active { background: rgba(255, 183, 77, 0.3); }
        
        /* 終極測試刪除按鈕 */
        .hard-reset-btn { display: block; width: 100%; text-align: center; color: var(--danger); font-size: 0.9rem; margin-top: 15px; padding: 15px; background: rgba(229, 115, 115, 0.1); border: 1px solid var(--danger); border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .hard-reset-btn:active { background: rgba(229, 115, 115, 0.3); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: var(--text-light); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-main); font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid var(--lavender); border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        .dual-date { display: flex; gap: 10px; }
        .dual-date > div { flex: 1; }
        .save-btn { width: 100%; padding: 15px; background: var(--baby-blue-ice); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* 照片網格 */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .photo-box { position: relative; width: 100%; aspect-ratio: 1; background: var(--alice-blue); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--periwinkle-3); cursor: pointer; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-add-icon { font-size: 2rem; color: var(--periwinkle-2); }
        .delete-photo-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; cursor: pointer; }

        /* 成功視窗專屬樣式 */
        #success-modal .modal-content { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 4rem; color: var(--success); margin-bottom: 10px; }
        .success-title { font-size: 1.5rem; color: var(--text-main); margin-bottom: 10px; }
        
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 300; justify-content: center; align-items: center; flex-direction: column; font-size: 1.2rem; font-weight: bold; color: var(--baby-blue-ice); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); text-align: center; padding: 20px;}
    </style>
</head>
<body>

    <div id="login-overlay" style="display:none;">
        <div class="login-title">請選擇登入身份</div>
        <button class="login-btn" onclick="login('S')">Sandy</button>
        <button class="login-btn" onclick="login('H')">Hailey</button>
    </div>

    <div class="container" id="main-container">
        <header>
            <div class="header-title-area">
                收租明細 <span id="current-user-tag" class="user-tag"></span>
            </div>
            <button class="logout-btn" onclick="logout()">切換身分</button>
        </header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('rent')">每週房租</button>
            <button class="tab-btn" onclick="switchTab('water')">水費</button>
            <button class="tab-btn" onclick="switchTab('energy')">電費煤氣</button>
            <button class="tab-btn" onclick="switchTab('net')">網路</button>
            <button class="tab-btn" onclick="switchTab('others')">其他</button>
        </div>

        <div class="content">
            <button id="add-item-btn" class="add-btn" onclick="openAddModal()">＋ 新增項目 (設定區間)</button>
            <div id="tab-content"></div>
            
            <button class="export-btn" onclick="exportWordAndClearPhotos()">📄 匯出圖文 Word 備份並釋放照片</button>
            <button class="hard-reset-btn" onclick="hardResetSystem()">🚨 刪除所有測試資料 (重新開始)</button>
        </div>
    </div>

    <div class="total-bar disabled" id="checkout-bar" onclick="triggerBatchUpload()">
        <div>
            <div id="bar-title">尚未選擇付款項目</div>
            <div class="hint" id="bar-hint">請勾選左側方格</div>
        </div>
        <div class="amount" id="total-amount">0</div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-modal')">&times;</span>
            <h3 style="margin-top:0;">新增紀錄</h3>
            <div class="input-group" id="name-input-group" style="display: none;">
                <label>項目名稱</label>
                <input type="text" id="new-item-name" placeholder="例如：買衛生紙、換燈泡">
            </div>
            <div class="input-group dual-date">
                <div><label>開始日期</label><input type="date" id="new-date-start"></div>
                <div><label>結束日期 (選填)</label><input type="date" id="new-date-end"></div>
            </div>
            <div class="input-group">
                <label>總金額 (AUD)</label>
                <input type="number" id="new-amount" placeholder="輸入完整金額">
            </div>
            <button class="save-btn" onclick="saveNewItem()">確認儲存</button>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('detail-modal')">&times;</span>
            <h3 id="modal-date" style="margin-top:0; font-size: 1.2rem; line-height: 1.4;">日期</h3>
            <p id="modal-price" style="color: var(--baby-blue-ice); font-weight: bold; font-size: 1.1rem;">金額</p>
            <div class="photo-grid" id="photo-grid"></div>
            <input type="file" id="single-photo-input" accept="image/jpeg, image/png, image/jpg, image/webp" style="display: none;" onchange="handleSinglePhotoUpload(this)">
        </div>
    </div>

    <div class="modal" id="success-modal">
        <div class="modal-content">
            <div class="success-icon">✔</div>
            <div class="success-title">操作完成！</div>
            <p id="success-message" style="color: var(--text-light); margin-bottom: 25px;">項目已標記為結清，並自動解鎖畫面。</p>
            <button class="save-btn" style="background: var(--success);" onclick="finishCheckout()">好的</button>
        </div>
    </div>

    <div id="loading-overlay">照片壓縮存檔中，請稍候...</div>
    <input type="file" id="batch-photo-input" accept="image/jpeg, image/png, image/jpg, image/webp" style="display: none;" onchange="handleBatchPhotoUpload(this)">

    <script>
        let currentUser = '';
        let currentTab = 'rent';
        let currentItemKey = '';
        
        let appData = JSON.parse(localStorage.getItem('rentDataV9')) || {
            checks_S: {}, checks_H: {}, 
            crossed_S: {}, crossed_H: {}, 
            photos: {}, 
            water: [], energy: [], others: []
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('activeUserV9');
            if (savedUser) {
                login(savedUser); 
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        };

        // --- 🚨 測試專用：一鍵殺掉所有資料重來 ---
        function hardResetSystem() {
            if(confirm('⚠️ 警告：確定要清空手機裡「所有的」帳務與照片紀錄，全部重新開始嗎？')) {
                localStorage.removeItem('rentDataV9');
                localStorage.removeItem('activeUserV9');
                alert('已成功清空所有測試資料！畫面將為您重新整理。');
                location.reload();
            }
        }

        // --- ⚙️ 圖文 Word 產生器與空間釋放 ---
        function exportWordAndClearPhotos() {
            if(!confirm('⚠️ 準備匯出 Word 備份並釋放空間\n\n系統將自動下載一份包含「所有文字明細與收據照片」的 Word 檔案。\n\n下載後，系統會【清除網頁中的照片】釋放容量，但您的文字帳務紀錄皆會完整保留。確定要執行嗎？')) {
                return;
            }

            document.getElementById('loading-overlay').innerHTML = "正在將所有照片與帳目打包成 Word...<br><span style='font-size:0.9rem; font-weight:normal; margin-top:10px;'>檔案較大，請耐心等候幾秒鐘</span>";
            document.getElementById('loading-overlay').style.display = 'flex';

            setTimeout(() => {
                let wordContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Sandy & Hailey 租屋帳務備份</title>
                    <style>
                        body { font-family: 'Microsoft JhengHei', Arial, sans-serif; color: #333; }
                        h1 { color: #3a4b73; text-align: center; border-bottom: 2px solid #abc4ff; padding-bottom: 10px; }
                        h2 { color: #6b7c9f; margin-top: 30px; border-left: 5px solid #e2eafc; padding-left: 10px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; vertical-align: top; }
                        th { background-color: #edf2fb; font-weight: bold; }
                        .status { font-weight: bold; color: #81c784; }
                        .unpaid { color: #e57373; }
                        .photo-img { max-width: 200px; max-height: 200px; margin: 5px; border: 1px solid #eee; display: inline-block; }
                    </style>
                </head>
                <body>
                    <h1>Sandy & Hailey 數位收租明細備份</h1>
                    <p><strong>匯出日期：</strong> ${new Date().toLocaleDateString()}</p>
                    <p>※ 本文件包含所有歷史帳目與已上傳之收據照片。</p>
                `;

                const renderTable = (title, items) => {
                    if (items.length === 0) return '';
                    let html = `<h2>${title}</h2><table><tr><th>日期/區間</th><th>項目名稱</th><th>金額 (AUD)</th><th>Sandy 狀態</th><th>Hailey 狀態</th><th>收據照片</th></tr>`;
                    
                    items.forEach(item => {
                        let imgHtml = '';
                        if (appData.photos[item.key] && appData.photos[item.key].length > 0) {
                            appData.photos[item.key].forEach(base64 => {
                                imgHtml += `<img class="photo-img" src="${base64}" />`;
                            });
                        } else {
                            imgHtml = '<span style="color:#999;">無照片</span>';
                        }
                        
                        html += `<tr>
                            <td>${item.date}</td>
                            <td>${item.name}</td>
                            <td>${item.amount}</td>
                            <td class="${item.statusS === '已結清' ? 'status' : 'unpaid'}">${item.statusS}</td>
                            <td class="${item.statusH === '已結清' ? 'status' : 'unpaid'}">${item.statusH}</td>
                            <td>${imgHtml}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                    return html;
                };

                let rentItems = [], netItems = [], waterItems = [], energyItems = [], otherItems = [];
                
                generateUTC_Dates('2026-05-17', 7, 52).forEach(date => {
                    const key = `rent_${date}`;
                    rentItems.push({ key: key, date: date, name: '-', amount: 'S 500 / H 400', statusS: appData.crossed_S[key] ? "已結清" : "未付", statusH: appData.crossed_H[key] ? "已結清" : "未付" });
                });

                generateUTC_Months('2026-05-15', 12).forEach(date => {
                    const key = `net_${date}`;
                    netItems.push({ key: key, date: date, name: '-', amount: '36', statusS: appData.crossed_S[key] ? "已結清" : "未付", statusH: appData.crossed_H[key] ? "已結清" : "未付" });
                });

                const parseCustomItems = (typeStr, arr) => {
                    appData[typeStr].forEach(item => {
                        const key = `${typeStr}_${item.id}`;
                        arr.push({ key: key, date: item.date, name: item.name || '-', amount: item.amount, statusS: appData.crossed_S[key] ? "已結清" : "未付", statusH: appData.crossed_H[key] ? "已結清" : "未付" });
                    });
                };

                parseCustomItems('water', waterItems);
                parseCustomItems('energy', energyItems);
                parseCustomItems('others', otherItems);

                wordContent += renderTable('每週房租', rentItems);
                wordContent += renderTable('網路費', netItems);
                wordContent += renderTable('水費', waterItems);
                wordContent += renderTable('電費煤氣', energyItems);
                wordContent += renderTable('其他雜項', otherItems);
                wordContent += `</body></html>`;

                const blob = new Blob(['\ufeff', wordContent], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const today = new Date().toISOString().split('T')[0];
                link.setAttribute("href", url);
                link.setAttribute("download", `租屋帳務備份_含照片_${today}.doc`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                appData.photos = {}; 
                saveData(); 

                document.getElementById('loading-overlay').style.display = 'none';
                
                document.getElementById('success-message').innerText = '圖文 Word 檔案已開始下載！\n\n網頁中的照片已清空以釋放空間，但您的所有文字帳務紀錄已為您保留。';
                document.getElementById('success-modal').style.display = 'flex';
                
            }, 500);
        }

        // --- 以下為系統原始核心代碼 ---
        function saveData() { 
            try {
                localStorage.setItem('rentDataV9', JSON.stringify(appData)); 
            } catch(e) {
                alert('🚨 儲存失敗！可能是照片太多把暫存空間撐爆了，請點擊下方的「匯出圖文 Word」按鈕來釋放空間。');
            }
        }

        function login(user) {
            currentUser = user;
            localStorage.setItem('activeUserV9', user); 
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            document.getElementById('current-user-tag').innerText = user === 'S' ? 'Sandy' : 'Hailey';
            renderTab();
        }

        document.addEventListener('DOMContentLoaded', function() {
            window.logout = function() {
                currentUser = '';
                localStorage.removeItem('activeUserV9'); 
                document.getElementById('main-container').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'flex';
            };
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTab();
        }

        function renderTab() {
            const container = document.getElementById('tab-content');
            const addBtn = document.getElementById('add-item-btn');
            container.innerHTML = '';
            
            if (['water', 'energy'].includes(currentTab) && currentUser === 'S') {
                addBtn.style.display = 'block';
            } else if (currentTab === 'others') {
                addBtn.style.display = 'block';
            } else {
                addBtn.style.display = 'none';
            }

            if (currentTab === 'rent') {
                const rentAmount = currentUser === 'S' ? 500 : 400;
                generateUTC_Dates('2026-05-17', 7, 52).forEach(date => {
                    container.appendChild(createCard(`rent_${date}`, date, '', rentAmount));
                });
            } else if (currentTab === 'net') {
                generateUTC_Months('2026-05-15', 12).forEach(date => {
                    container.appendChild(createCard(`net_${date}`, date, '', 36));
                });
            } else if (['water', 'energy', 'others'].includes(currentTab)) {
                let items = appData[currentTab].sort((a,b) => {
                    let dateA = a.date.split(' ~ ')[0];
                    let dateB = b.date.split(' ~ ')[0];
                    return new Date(dateB) - new Date(dateA);
                });
                
                items.forEach(item => {
                    let displayAmount = item.amount;
                    if (['water', 'energy'].includes(currentTab) && currentUser === 'H') {
                        displayAmount = item.amount / 2;
                    }
                    container.appendChild(createCard(`${currentTab}_${item.id}`, item.date, item.name || '', displayAmount));
                });
            }
            updateTotal();
        }

        function createCard(key, dateStr, subtitleStr, displayPrice) {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            const crossed = currentUser === 'S' ? appData.crossed_S : appData.crossed_H;
            
            const isChecked = checks[key] ? 'checked' : '';
            const isCrossed = crossed[key]; 
            
            const div = document.createElement('div');
            div.className = 'card';
            
            let checkboxHTML = '';
            let textClass = '';

            if (isCrossed) {
                checkboxHTML = `<div class="checkbox-container"><div class="paid-badge">✔ 已付</div></div>`;
                textClass = 'crossed-out';
            } else {
                checkboxHTML = `
                <div class="checkbox-container">
                    <div class="checkbox ${isChecked}" onclick="event.stopPropagation(); toggleCheck('${key}')"></div>
                </div>`;
            }
            
            let subtitleHTML = subtitleStr ? `<div class="item-subtitle">${subtitleStr}</div>` : '';

            div.innerHTML = `
                ${checkboxHTML}
                <div class="item-info ${textClass}" onclick="openDetailModal('${key}', '${dateStr}', subtitleStr ? '${subtitleStr}' : '', '${displayPrice}')">
                    <div class="item-date">${dateStr}</div>
                    ${subtitleHTML}
                    <div class="item-price">${displayPrice} AUD</div>
                </div>
            `;
            return div;
        }

        function toggleCheck(key) {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            checks[key] = !checks[key];
            saveData();
            updateTotal();
            renderTab(); 
        }

        function updateTotal() {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            let total = 0;
            let hasChecked = false;

            for (let key in checks) {
                if (checks[key]) {
                    hasChecked = true;
                    const [type, id] = key.split('_');
                    if (type === 'rent') total += (currentUser === 'S' ? 500 : 400);
                    if (type === 'net') total += 36;
                    if (type === 'water' || type === 'energy') {
                        const item = appData[type].find(i => i.id == id);
                        if (item) total += (item.amount / 2);
                    }
                    if (type === 'others') {
                        const item = appData.others.find(i => i.id == id);
                        if (item) total += parseFloat(item.amount);
                    }
                }
            }
            
            const bar = document.getElementById('checkout-bar');
            document.getElementById('total-amount').innerText = total + ' AUD';
            
            if (hasChecked) {
                bar.className = 'total-bar active';
                document.getElementById('bar-title').innerText = '點擊確認付款';
                document.getElementById('bar-hint').innerText = '將為選取的項目上傳憑證';
            } else {
                bar.className = 'total-bar disabled';
                document.getElementById('bar-title').innerText = '尚未選擇項目';
                document.getElementById('bar-hint').innerText = '請勾選左側方格';
            }
        }

        function openAddModal() {
            document.getElementById('new-date-start').value = '';
            document.getElementById('new-date-end').value = '';
            document.getElementById('new-amount').value = '';
            document.getElementById('new-item-name').value = '';
            
            document.getElementById('name-input-group').style.display = (currentTab === 'others') ? 'block' : 'none';
            document.getElementById('add-modal').style.display = 'flex';
        }

        function saveNewItem() {
            const start = document.getElementById('new-date-start').value;
            const end = document.getElementById('new-date-end').value;
            const amount = document.getElementById('new-amount').value;
            const name = document.getElementById('new-item-name').value;
            
            if(!start || !amount) return alert('請至少填寫開始日期與金額');
            if(currentTab === 'others' && !name) return alert('請填寫項目名稱');
            
            let finalDateStr = end ? `${start} ~ ${end}` : start;
            
            let newItem = { id: Date.now(), date: finalDateStr, amount: amount };
            if(currentTab === 'others') newItem.name = name; 
            
            appData[currentTab].push(newItem);
            saveData();
            closeModal('add-modal');
            renderTab();
        }

        function openDetailModal(key, date, subtitle, price) {
            currentItemKey = key;
            document.getElementById('modal-date').innerHTML = date + (subtitle ? `<br><span style="font-size:0.95rem; color:var(--text-light);">${subtitle}</span>` : '');
            document.getElementById('modal-price').innerText = price + " AUD";
            
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            let photos = appData.photos[key] || [];
            
            photos.forEach((base64, index) => {
                const box = document.createElement('div');
                box.className = 'photo-box';
                box.innerHTML = `
                    <img src="${base64}">
                    <div class="delete-photo-btn" onclick="deletePhoto('${key}', ${index}, event)">×</div>
                `;
                grid.appendChild(box);
            });

            if (photos.length < 4) {
                const addBox = document.createElement('div');
                addBox.className = 'photo-box';
                addBox.innerHTML = `<div class="photo-add-icon">＋</div>`;
                addBox.onclick = () => document.getElementById('single-photo-input').click();
                grid.appendChild(addBox);
            }
            document.getElementById('detail-modal').style.display = 'flex';
        }
        
        function deletePhoto(key, index, event) {
            event.stopPropagation();
            if(confirm('確定要刪除這張照片嗎？')) {
                appData.photos[key].splice(index, 1);
                saveData();
                closeModal('detail-modal'); 
            }
        }

        function triggerBatchUpload() {
            const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
            const hasChecked = Object.values(checks).some(v => v === true);
            if(!hasChecked) return; 
            document.getElementById('batch-photo-input').click();
        }

        function handleBatchPhotoUpload(input) {
            if (input.files && input.files[0]) {
                document.getElementById('loading-overlay').innerHTML = "照片壓縮存檔中，請稍候...";
                document.getElementById('loading-overlay').style.display = 'flex';
                
                const checks = currentUser === 'S' ? appData.checks_S : appData.checks_H;
                const crossed = currentUser === 'S' ? appData.crossed_S : appData.crossed_H;
                
                compressImage(input.files[0], (base64) => {
                    for (let key in checks) {
                        if (checks[key]) {
                            if(!appData.photos[key]) appData.photos[key] = [];
                            if(appData.photos[key].length < 4) appData.photos[key].push(base64);
                            crossed[key] = true;
                            checks[key] = false; 
                        }
                    }
                    saveData();
                    document.getElementById('loading-overlay').style.display = 'none';
                    
                    document.getElementById('success-message').innerText = '項目已標記為結清，並自動解鎖畫面。';
                    document.getElementById('success-modal').style.display = 'flex';
                });
            }
            input.value = ''; 
        }

        function handleSinglePhotoUpload(input) {
            if (input.files && input.files[0]) {
                document.getElementById('loading-overlay').innerHTML = "照片壓縮存檔中，請稍候...";
                document.getElementById('loading-overlay').style.display = 'flex';
                compressImage(input.files[0], (base64) => {
                    if(!appData.photos[currentItemKey]) appData.photos[currentItemKey] = [];
                    appData.photos[currentItemKey].push(base64);
                    saveData();
                    document.getElementById('loading-overlay').style.display = 'none';
                    closeModal('detail-modal'); 
                });
            }
            input.value = '';
        }

        function finishCheckout() {
            closeModal('success-modal');
            updateTotal();
            renderTab();
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onerror = () => { alert('檔案讀取失敗！'); document.getElementById('loading-overlay').style.display = 'none'; };
            reader.onload = event => {
                const img = new Image();
                img.onerror = () => { alert('無法處理照片。'); document.getElementById('loading-overlay').style.display = 'none'; };
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; 
                    let finalWidth = img.width; let finalHeight = img.height;
                    if (img.width > MAX_WIDTH) {
                        const scaleSize = MAX_WIDTH / img.width;
                        finalWidth = MAX_WIDTH; finalHeight = img.height * scaleSize;
                    }
                    canvas.width = finalWidth; canvas.height = finalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.4)); 
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function generateUTC_Dates(startStr, gapDays, count) {
            let dates = [];
            let [y, m, d] = startStr.split('-');
            let curr = new Date(Date.UTC(y, m - 1, d)); 
            for (let i = 0; i < count; i++) {
                dates.push(curr.toISOString().split('T')[0]);
                curr.setUTCDate(curr.getUTCDate() + gapDays);
            }
            return dates;
        }

        function generateUTC_Months(startStr, count) {
            let dates = [];
            let [y, m, d] = startStr.split('-');
            let curr = new Date(Date.UTC(y, m - 1, d)); 
            for (let i = 0; i < count; i++) {
                dates.push(curr.toISOString().split('T')[0]);
                curr.setUTCMonth(curr.getUTCMonth() + 1);
            }
            return dates;
        }
    </script>
</body>
